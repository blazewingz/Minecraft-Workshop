<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0a09"><title>Armoury · Minecraft Workshop</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23241d17'/%3E%3Cpath d='M12 12 32 5l20 7 5 27-10 8v12H15V47L5 39z' fill='%23717b83' stroke='%23302d29' stroke-width='3'/%3E%3Cpath d='M12 31h40M18 42h28' stroke='%23d4b168' stroke-width='5'/%3E%3C/svg%3E"><link rel="stylesheet" href="../../shared/site.css"><style>
body{min-height:100vh}.app{display:grid;grid-template-columns:300px minmax(380px,1fr) 320px;gap:12px;padding-bottom:14px}.panel-pad{padding:14px}.patterns{max-height:calc(100vh - 150px);min-height:620px;overflow:auto}.pattern-list{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.pattern{display:grid;grid-template-columns:54px 1fr;gap:6px;align-items:center;background:#12100e;border:1px solid #3d3229;padding:7px;cursor:pointer;text-align:left;color:inherit}.pattern:hover,.pattern.active{background:#201914;border-color:#967b5d}.pattern img{width:46px;height:46px;image-rendering:pixelated;object-fit:contain}.pattern b{font-size:8px;line-height:1.2}.pattern small{display:block;margin-top:3px;color:#6f665d;font-size:7px}.preview{padding:12px;min-height:760px}.preview-stage{height:680px;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 35%,rgba(110,94,75,.17),transparent 34%),linear-gradient(#151210,#0a0908);border:1px solid #3f352d;cursor:grab}.preview-stage:active{cursor:grabbing}.floor{position:absolute;bottom:48px;width:320px;height:35px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.65),transparent 68%);filter:blur(3px)}.model-wrap{position:relative;width:360px;height:590px;perspective:900px;transform-style:preserve-3d;user-select:none}.model{position:absolute;left:50%;top:60px;width:0;height:0;transform-style:preserve-3d;transform:translateX(-50%) rotateX(-3deg) rotateY(-22deg);transition:transform .06s linear}.mc-cube{position:absolute;transform-style:preserve-3d}.face{position:absolute;backface-visibility:hidden;background-repeat:no-repeat;image-rendering:pixelated}.head{left:-43px;top:-8px;width:86px;height:86px}.body{left:-43px;top:84px;width:86px;height:129px}.arm{width:43px;height:129px;top:86px}.arm.left{left:-86px}.arm.right{left:43px}.leg{width:43px;height:129px;top:213px}.leg.left{left:-43px}.leg.right{left:0}.cap{position:absolute;inset:-3px;border:3px solid rgba(255,255,255,.10);box-shadow:0 0 0 1px #0008,inset 0 0 0 2px #0006;pointer-events:none}.skin-face{background-image:url('../../assets/Ducki.png')}.armor{position:absolute;inset:-5px;background:var(--armor);border:3px solid #25231f;box-shadow:inset 3px 3px rgba(255,255,255,.12),inset -4px -5px rgba(0,0,0,.30);opacity:.96}.trim-face{position:absolute;inset:3px;background-image:var(--trim-img);background-repeat:no-repeat;background-size:100% 100%;background-position:center;opacity:.98;mix-blend-mode:screen;filter:var(--trim-filter);pointer-events:none}.helmet-shell{position:absolute;left:-50px;top:-17px;width:100px;height:100px;clip-path:polygon(9% 0,91% 0,100% 16%,96% 83%,82% 100%,18% 100%,4% 83%,0 16%);border:3px solid #25231f;background:var(--armor);box-shadow:inset 5px 4px rgba(255,255,255,.10),inset -6px -8px rgba(0,0,0,.25);}.chest-shell{left:-50px;top:76px;width:100px;height:147px;clip-path:polygon(16% 0,84% 0,100% 17%,84% 100%,16% 100%,0 17%);}.boots-shell{width:48px;height:47px;top:304px;clip-path:polygon(3% 0,97% 0,94% 82%,64% 92%,40% 76%,6% 82%)}.boot-l{left:-47px}.boot-r{left:0}.legs-shell{left:-50px;top:200px;width:100px;height:146px;clip-path:polygon(3% 0,97% 0,88% 100%,58% 100%,50% 60%,42% 100%,12% 100%)}.trim-acc{position:absolute;inset:0;background-image:var(--trim-img);background-repeat:no-repeat;background-size:100% 100%;opacity:.95;mix-blend-mode:screen;filter:var(--trim-filter)}.stand-base{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:118px;height:20px;background:linear-gradient(#73573b,#4b3827);border:3px solid #2a2119;box-shadow:0 8px 0 #070504}.stand-pole{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);width:10px;height:305px;background:linear-gradient(90deg,#493727,#8a6948 50%,#4a3929);border:2px solid #2a2119;z-index:-1}.pose-bar{display:flex;justify-content:center;gap:6px;padding:10px 0 2px}.pose-bar button{background:#17130f;border:1px solid #4e4033;color:#8c8277;padding:7px 9px;font-size:8px;cursor:pointer}.pose-bar button:hover{border-color:#8c6c50;color:#eee5d9}.right{display:flex;flex-direction:column;gap:12px}.slot-stack{display:grid;gap:8px}.slot{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:9px;padding:8px;background:#12100e;border:1px solid #3d3229;cursor:pointer;text-align:left;color:inherit}.slot:hover,.slot.active{background:#211913;border-color:#907655}.slot img{width:50px;height:50px;image-rendering:pixelated;object-fit:contain}.slot-name{font-size:10px}.slot-trim{font-size:8px;color:#766e65;margin-top:3px}.chev{color:#9d896e;font-size:12px}.picker{display:none;padding:9px;background:#14110e;border:1px solid #483a2f;max-height:260px;overflow:auto}.picker.open{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pick{border:1px solid #3d332a;background:#100e0c;padding:5px;cursor:pointer;display:grid;place-items:center;gap:3px;color:inherit}.pick:hover{border-color:#987a58;background:#1f1813}.pick img{width:45px;height:45px;image-rendering:pixelated;object-fit:contain}.pick span{font-size:7px;text-align:center;color:#80766c}.materials{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.mat{border:1px solid #41352c;background:#12100e;padding:6px 4px;cursor:pointer;color:inherit;display:grid;gap:4px;place-items:center}.mat i{width:24px;height:24px;border:2px solid #221e1a;box-shadow:inset 2px 2px rgba(255,255,255,.14),inset -2px -2px rgba(0,0,0,.18)}.mat span{font-size:7px;text-align:center;color:#817870}.mat.active{outline:2px solid var(--gold);outline-offset:1px}.skin-box{display:grid;gap:8px}.skin-line{display:flex;gap:7px;align-items:center}.skin-thumb{width:48px;height:48px;object-fit:contain;background:#0e0c0a;border:1px solid #493b30;image-rendering:pixelated}.skin-msg{font-size:8px;color:#7b7269;line-height:1.4}.file-btn{position:relative;overflow:hidden}.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}.enchanted .armor,.enchanted .helmet-shell,.enchanted .trim-acc{animation:glint 2.7s linear infinite}@keyframes glint{0%,100%{filter:brightness(1)}45%{filter:brightness(1.22)}55%{filter:brightness(.96)}}
@media(max-width:1100px){.app{grid-template-columns:250px minmax(330px,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.patterns{max-height:none}.preview{min-height:700px}.preview-stage{height:620px}}@media(max-width:760px){.app{grid-template-columns:1fr}.right{grid-template-columns:1fr}.patterns{min-height:auto}.pattern-list{grid-template-columns:repeat(3,1fr)}.preview-stage{height:560px}.model-wrap{transform:scale(.86)} }
</style></head><body><header class="site-shell topbar"><div class="brand"><a class="brand-icon ui3d" href="../../" aria-label="Minecraft Workshop"><svg viewBox="0 0 64 64"><path d="M8 14h48v10H8zM14 24h36v11H14zM21 35h22v12H21zM17 47h30v9H17z" fill="#938c83"/></svg></a><div><div class="eyebrow">MINECRAFT WORKSHOP</div><div class="tool-name">Armoury</div></div></div><div></div><div class="header-right"><nav class="nav"><a href="../../">Workshop</a><a class="active" href="./">Armoury</a><a href="../banner/">Banner</a><a href="../nether/">Nether</a></nav></div></header><main class="site-shell app"><aside class="panel depth-ui panel-pad patterns"><div class="section-head"><div><div class="kicker">TRIM PATTERNS</div><h2>Templates</h2></div><span class="small muted" id="patternCount"></span></div><div class="pattern-list" id="patterns"></div></aside><section class="panel depth-ui preview"><div class="section-head"><div><div class="kicker">PREVIEW</div><h2 id="previewTitle">Diamond · Sentry</h2></div><label class="btn ghost ui3d" style="position:relative;overflow:hidden"><input id="enchanted" type="checkbox" style="margin:0 6px 0 0;appearance:auto"> Enchanted</label></div><div class="preview-stage" id="previewStage"><div class="model-wrap"><div class="stand-pole"></div><div class="model" id="model"><div class="mc-cube head" data-part="head"></div><div class="mc-cube body" data-part="chest"></div><div class="mc-cube arm left" data-part="leftArm"></div><div class="mc-cube arm right" data-part="rightArm"></div><div class="mc-cube leg left" data-part="leftLeg"></div><div class="mc-cube leg right" data-part="rightLeg"></div><div class="helmet-shell armor-shell" data-armor-slot="helmet"><div class="trim-acc"></div></div><div class="chest-shell armor-shell" data-armor-slot="chest"><div class="trim-acc"></div></div><div class="legs-shell armor-shell" data-armor-slot="legs"><div class="trim-acc"></div></div><div class="boots-shell boot-l armor-shell" data-armor-slot="boots"><div class="trim-acc"></div></div><div class="boots-shell boot-r armor-shell" data-armor-slot="boots"><div class="trim-acc"></div></div></div><div class="stand-base"></div></div><div class="floor"></div></div><div class="pose-bar"><button id="front">Front</button><button id="turn">Turn</button><button id="back">Back</button></div></section><aside class="right"><section class="panel depth-ui panel-pad"><div class="section-head"><div><div class="kicker">ARMOUR</div><h2>Set</h2></div><span class="small muted" id="activeSlotLabel">Helmet</span></div><div class="slot-stack" id="slots"></div><div class="picker" id="picker"></div></section><section class="panel depth-ui panel-pad"><div class="section-head"><div><div class="kicker">TRIM MATERIAL</div><h2>Colour</h2></div><span class="small muted" id="activeMaterialLabel">Amethyst</span></div><div class="materials" id="materials"></div></section><section class="panel depth-ui panel-pad"><div class="section-head"><div><div class="kicker">SKIN</div><h2>Player</h2></div><span class="small muted">64×64 · 128×128</span></div><div class="skin-box"><div class="skin-line"><img id="skinThumb" class="skin-thumb pixel" src="../../assets/Ducki.png"><div class="skin-msg" id="skinMsg">Ducki.png</div></div><label class="btn ui3d file-btn">Upload Skin<input id="skinFile" type="file" accept="image/png,image/jpeg,image/webp"></label></div></section></aside></main><nav class="site-shell footer-nav"><a class="btn ui3d" href="../../">Workshop</a><a class="btn ui3d" href="../enchanting/">Enchanting</a><a class="btn ui3d" href="../banner/">Banner</a><a class="btn ui3d" href="../nether/">Nether ↔ Overworld</a></nav><script>
const BASE='https://mcasset.cloud/26.3/assets/minecraft/';
const patterns=[['sentry','Sentry'],['dune','Dune'],['coast','Coast'],['wild','Wild'],['ward','Ward'],['vex','Vex'],['tide','Tide'],['snout','Snout'],['rib','Rib'],['spire','Spire'],['wayfinder','Wayfinder'],['shaper','Shaper'],['silence','Silence'],['raiser','Raiser'],['host','Host'],['flow','Flow'],['bolt','Bolt'],['eye','Eye']];
const mats=[['quartz','Quartz','#e7dfd2'],['iron','Iron','#9c9c96'],['gold','Gold','#f2c14a'],['diamond','Diamond','#54e3d7'],['netherite','Netherite','#4b3b54'],['redstone','Redstone','#d8473c'],['copper','Copper','#c87549'],['emerald','Emerald','#36c578'],['lapis','Lapis Lazuli','#4278d3'],['amethyst','Amethyst','#a469d2'],['resin','Resin Brick','#d56d56']];
const pieces={helmet:{name:'Helmet',items:[['leather','Leather Helmet','leather_helmet'],['chainmail','Chainmail Helmet','chainmail_helmet'],['iron','Iron Helmet','iron_helmet'],['gold','Golden Helmet','golden_helmet'],['diamond','Diamond Helmet','diamond_helmet'],['netherite','Netherite Helmet','netherite_helmet'],['copper','Copper Helmet','copper_helmet'],['turtle','Turtle Shell','turtle_helmet']]},chest:{name:'Chestplate',items:[['leather','Leather Chestplate','leather_chestplate'],['chainmail','Chainmail Chestplate','chainmail_chestplate'],['iron','Iron Chestplate','iron_chestplate'],['gold','Golden Chestplate','golden_chestplate'],['diamond','Diamond Chestplate','diamond_chestplate'],['netherite','Netherite Chestplate','netherite_chestplate'],['copper','Copper Chestplate','copper_chestplate']]},legs:{name:'Leggings',items:[['leather','Leather Leggings','leather_leggings'],['chainmail','Chainmail Leggings','chainmail_leggings'],['iron','Iron Leggings','iron_leggings'],['gold','Golden Leggings','golden_leggings'],['diamond','Diamond Leggings','diamond_leggings'],['netherite','Netherite Leggings','netherite_leggings'],['copper','Copper Leggings','copper_leggings']]},boots:{name:'Boots',items:[['leather','Leather Boots','leather_boots'],['chainmail','Chainmail Boots','chainmail_boots'],['iron','Iron Boots','iron_boots'],['gold','Golden Boots','golden_boots'],['diamond','Diamond Boots','diamond_boots'],['netherite','Netherite Boots','netherite_boots'],['copper','Copper Boots','copper_boots']]}};
const slots={helmet:{type:'helmet',base:'diamond',trim:'sentry'},chest:{type:'chest',base:'diamond',trim:'sentry'},legs:{type:'legs',base:'diamond',trim:'sentry'},boots:{type:'boots',base:'diamond',trim:'sentry'}};let activeSlot='helmet',pickerOpen=false;const $=id=>document.getElementById(id);
function itemUrl(id){return BASE+'textures/item/'+id+'.png'}
function templateUrl(id){return BASE+'textures/item/'+id+'_armor_trim_smithing_template.png'}
function trimUrl(pattern,leggings=false){return BASE+'textures/trims/entity/'+(leggings?'humanoid_leggings/':'humanoid/')+pattern+'.png'}
function filterFor(c){const f={quartz:'brightness(0) saturate(100%) invert(91%) sepia(10%) saturate(323%) hue-rotate(347deg) brightness(106%) contrast(84%)',iron:'brightness(0) saturate(100%) invert(74%) sepia(4%) saturate(325%) hue-rotate(354deg) brightness(94%) contrast(86%)',gold:'brightness(0) saturate(100%) invert(80%) sepia(87%) saturate(633%) hue-rotate(5deg) brightness(105%) contrast(97%)',diamond:'brightness(0) saturate(100%) invert(79%) sepia(57%) saturate(611%) hue-rotate(128deg) brightness(102%) contrast(99%)',netherite:'brightness(0) saturate(100%) invert(28%) sepia(18%) saturate(1022%) hue-rotate(252deg) brightness(83%) contrast(89%)',redstone:'brightness(0) saturate(100%) invert(34%) sepia(52%) saturate(2794%) hue-rotate(335deg) brightness(94%) contrast(85%)',copper:'brightness(0) saturate(100%) invert(53%) sepia(35%) saturate(1058%) hue-rotate(333deg) brightness(95%) contrast(87%)',emerald:'brightness(0) saturate(100%) invert(62%) sepia(49%) saturate(1037%) hue-rotate(105deg) brightness(86%) contrast(97%)',lapis:'brightness(0) saturate(100%) invert(39%) sepia(61%) saturate(1320%) hue-rotate(186deg) brightness(85%) contrast(93%)',amethyst:'brightness(0) saturate(100%) invert(53%) sepia(35%) saturate(1208%) hue-rotate(243deg) brightness(100%) contrast(88%)',resin:'brightness(0) saturate(100%) invert(53%) sepia(52%) saturate(1722%) hue-rotate(323deg) brightness(98%) contrast(91%)'};return f[c]||'none'}
const armorPal={leather:'#6b4938',chainmail:'#9b9c95',iron:'#8d908d',gold:'#d9ac3d',diamond:'#4abec5',netherite:'#403345',copper:'#bd724a',turtle:'#73885a'};
function makePatterns(){ $('patterns').innerHTML=patterns.map(p=>`<button class="pattern ${p[0]==='sentry'?'active':''}" data-pattern="${p[0]}"><img src="${templateUrl(p[0])}" alt=""><span><b>${p[1]}</b><small>Armor Trim</small></span></button>`).join('');$('patternCount').textContent=patterns.length+' patterns';document.querySelectorAll('.pattern').forEach(b=>b.onclick=()=>{slots[activeSlot].trim=b.dataset.pattern;document.querySelectorAll('.pattern').forEach(x=>x.classList.toggle('active',x===b));render()})}
function makeSlots(){ $('slots').innerHTML=Object.entries(slots).map(([id,s])=>{const piece=pieces[s.type],it=piece.items.find(x=>x[0]===s.base);return `<button class="slot ${id===activeSlot?'active':''}" data-slot="${id}"><img src="${itemUrl(it[2])}" alt=""><span><span class="slot-name">${piece.name}</span><span class="slot-trim">${it[1].replace(piece.name,'').trim()||it[1]} · ${patterns.find(p=>p[0]===s.trim)?.[1]||s.trim} · ${mats.find(m=>m[0]===currentMat(id))?.[1]||'Amethyst'}</span></span><span class="chev">›</span></button>`}).join('');document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{activeSlot=b.dataset.slot;pickerOpen=true;makeSlots();makePicker();setActiveMaterial();})}
function currentMat(id){return slots[id].mat||'amethyst'}
function makePicker(){const s=slots[activeSlot],list=pieces[s.type].items;const box=$('picker');box.classList.toggle('open',pickerOpen);box.innerHTML=pickerOpen?list.map(it=>`<button class="pick" data-base="${it[0]}"><img src="${itemUrl(it[2])}" alt=""><span>${it[1].replace(pieces[s.type].name,'').trim()||it[1]}</span></button>`).join(''):'';document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{slots[activeSlot].base=b.dataset.base;pickerOpen=false;makeSlots();makePicker();render()})}
function makeMaterials(){ $('materials').innerHTML=mats.map(m=>`<button class="mat ${m[0]==='amethyst'?'active':''}" data-mat="${m[0]}"><i style="background:${m[2]}"></i><span>${m[1]}</span></button>`).join('');document.querySelectorAll('.mat').forEach(b=>b.onclick=()=>{slots[activeSlot].mat=b.dataset.mat;setActiveMaterial();render()})}
function setActiveMaterial(){const m=currentMat(activeSlot),obj=mats.find(x=>x[0]===m);$('activeMaterialLabel').textContent=obj?obj[1]:m;document.querySelectorAll('.mat').forEach(b=>b.classList.toggle('active',b.dataset.mat===m));$('activeSlotLabel').textContent=pieces[slots[activeSlot].type].name;}
function render(){const s=slots[activeSlot];$('previewTitle').textContent=`${pieces[s.type].items.find(x=>x[0]===s.base)?.[1]||s.base} · ${patterns.find(p=>p[0]===s.trim)?.[1]||'No trim'}`;document.querySelectorAll('.armor-shell').forEach(el=>{const type=el.dataset.armorSlot,conf=slots[type];el.style.setProperty('--armor',armorPal[conf.base]||'#777');el.style.setProperty('--trim-img',`url("${trimUrl(conf.trim,type==='legs')}")`);el.style.setProperty('--trim-filter',filterFor(conf.mat||'amethyst'))});setActiveMaterial()}
// skin mapping
function applySkin(src,w){const scale=w/64,unit=10;const S={head:{w:8,h:8,faces:{front:[8,8],back:[24,8],left:[0,8],right:[16,8],top:[8,0],bottom:[16,0]}},body:{w:8,h:12,faces:{front:[20,20],back:[32,20],left:[16,20],right:[28,20],top:[20,16],bottom:[28,16]}},rightArm:{w:4,h:12,faces:{front:[44,20],back:[52,20],left:[40,20],right:[48,20],top:[44,16],bottom:[48,16]}},leftArm:{w:4,h:12,faces:{front:[36,52],back:[44,52],left:[32,52],right:[40,52],top:[36,48],bottom:[40,48]}},rightLeg:{w:4,h:12,faces:{front:[4,20],back:[12,20],left:[0,20],right:[8,20],top:[4,16],bottom:[8,16]}},leftLeg:{w:4,h:12,faces:{front:[20,52],back:[28,52],left:[16,52],right:[24,52],top:[20,48],bottom:[24,48]}}};document.querySelectorAll('[data-part]').forEach(el=>{const n=el.dataset.part, s=S[n];el.innerHTML=Object.entries(s.faces).map(([face,p])=>{const fw=(face==='top'||face==='bottom')?s.w:s.w;const fh=(face==='top'||face==='bottom')?s.w:s.h;return `<div class="face ${face} skin-face" style="width:${fw*unit}px;height:${fh*unit}px;background-size:${64*scale*unit}px ${64*scale*unit}px;background-position:-${p[0]*scale*unit}px -${p[1]*scale*unit}px"></div>`}).join('');const faces=el.querySelectorAll('.face');const W=s.w*unit,H=s.h*unit,D=s.w*unit;faces.forEach(f=>{const n=f.classList[1];if(n==='front')f.style.transform=`translateZ(${D/2}px)`;if(n==='back')f.style.transform=`rotateY(180deg) translateZ(${D/2}px)`;if(n==='left')f.style.transform=`rotateY(-90deg) translateZ(${s.w*unit/2}px)`;if(n==='right')f.style.transform=`rotateY(90deg) translateZ(${s.w*unit/2}px)`;if(n==='top')f.style.transform=`rotateX(90deg) translateZ(${s.w*unit/2}px)`;if(n==='bottom')f.style.transform=`rotateX(-90deg) translateZ(${s.h*0+ s.w*unit/2}px)`});});}
function syncSkin(){const img=new Image();img.onload=()=>{applySkin(img.src,img.width);$('skinThumb').src=img.src};img.src=window.skinSrc||'../../assets/Ducki.png'}
let drag=false,lastX=0,lastY=0,ry=-22,rx=-3;$('previewStage').addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;$('previewStage').setPointerCapture(e.pointerId)});$('previewStage').addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-lastX)*.45;rx+=(e.clientY-lastY)*.25;rx=Math.max(-22,Math.min(18,rx));lastX=e.clientX;lastY=e.clientY;$('model').style.transform=`translateX(-50%) rotateX(${rx}deg) rotateY(${ry}deg)`});$('previewStage').addEventListener('pointerup',()=>drag=false);$('previewStage').addEventListener('pointercancel',()=>drag=false);$('front').onclick=()=>{ry=-22;rx=-3;$('model').style.transform=`translateX(-50%) rotateX(${rx}deg) rotateY(${ry}deg)`};$('turn').onclick=()=>{ry+=90;$('model').style.transform=`translateX(-50%) rotateX(${rx}deg) rotateY(${ry}deg)`};$('back').onclick=()=>{ry+=180;$('model').style.transform=`translateX(-50%) rotateX(${rx}deg) rotateY(${ry}deg)`};$('enchanted').onchange=()=>{$('previewStage').classList.toggle('enchanted',$('enchanted').checked)};$('skinFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{if(!((img.width===64&&img.height===64)||(img.width===128&&img.height===128))){$('skinMsg').textContent='64×64 or 128×128 only';return}window.skinSrc=img.src;$('skinMsg').textContent=f.name;$('skinThumb').src=img.src;applySkin(img.src,img.width)};img.src=URL.createObjectURL(f)};
makePatterns();makeMaterials();makeSlots();makePicker();setActiveMaterial();syncSkin();render();
</script><script src="../../shared/global-3d.js"></script></body></html>
