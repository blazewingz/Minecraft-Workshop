<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0a09"><title>Banner Editor · Minecraft Workshop</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23241d17'/%3E%3Cpath d='M18 9h7v46h-7zM25 14h29v36H25z' fill='%23bdb7ae' stroke='%233a332d' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="../../shared/site.css"><style>
.editor{display:grid;grid-template-columns:300px minmax(360px,1fr) 320px;gap:12px;padding-bottom:14px}.patterns{min-height:720px;padding:14px;overflow:auto}.pattern-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}.pbtn{display:grid;grid-template-columns:44px 1fr;gap:7px;align-items:center;background:#12100e;border:1px solid #3d3229;color:inherit;text-align:left;padding:6px;cursor:pointer}.pbtn:hover,.pbtn.active{background:#201914;border-color:#907455}.pbtn canvas{width:40px;height:55px;image-rendering:pixelated;background:#2b251f}.pbtn img{width:38px;height:38px;object-fit:contain;image-rendering:pixelated}.pbtn b{font-size:8px}.pbtn small{font-size:7px;color:#6f675e;display:block;margin-top:3px}.canvas-panel{padding:12px;min-height:720px}.stage{height:620px;display:grid;place-items:center;position:relative;border:1px solid #3f352d;background:radial-gradient(circle at 50% 34%,rgba(109,92,73,.14),transparent 36%),linear-gradient(#151210,#090807);overflow:hidden}.banner-wrap{display:flex;gap:46px;align-items:center}.banner-view{position:relative;display:grid;place-items:center}.banner-view canvas{width:230px;height:370px;image-rendering:pixelated;filter:drop-shadow(12px 14px 0 rgba(0,0,0,.34))}.pole{position:absolute;width:14px;height:390px;left:-10px;top:-10px;background:linear-gradient(90deg,#4a3728,#906c49 50%,#483626);border:2px solid #29221a}.shield-wrap{position:relative;display:grid;place-items:center;min-width:250px}.shield{width:230px;height:300px;position:relative;background:#d9d1c6;clip-path:polygon(7% 0,93% 0,93% 75%,50% 100%,7% 75%);box-shadow:inset 0 0 0 8px #24211d,0 12px 22px rgba(0,0,0,.33);overflow:hidden}.shield canvas{width:100%;height:100%;image-rendering:pixelated}.shield-frame{position:absolute;inset:0;border:10px solid #292622;clip-path:polygon(7% 0,93% 0,93% 75%,50% 100%,7% 75%);pointer-events:none}.preview-toggle{position:absolute;right:12px;top:12px;display:flex;gap:5px}.toggle{padding:7px 9px;border:1px solid #514236;background:#15110e;color:#827970;font-size:8px;cursor:pointer}.toggle.active{color:#eee5da;border-color:#967754;background:#221a14}.side{display:flex;flex-direction:column;gap:12px}.box{padding:12px}.dye-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.dye{border:1px solid #40342b;background:#12100e;padding:6px;cursor:pointer;color:inherit;display:grid;place-items:center;gap:4px}.dye i{width:24px;height:24px;border:2px solid #26211c;box-shadow:inset 2px 2px rgba(255,255,255,.14),inset -2px -2px rgba(0,0,0,.16)}.dye span{font-size:7px;color:#81776e}.dye.active{outline:2px solid var(--gold);outline-offset:1px}.layers{display:grid;gap:6px;margin-top:9px;max-height:310px;overflow:auto}.layer{display:grid;grid-template-columns:38px 1fr auto;gap:7px;align-items:center;padding:6px;background:#12100e;border:1px solid #3d332a}.layer img{width:34px;height:46px;object-fit:contain;background:#2b251f;image-rendering:pixelated}.layer b{font-size:8px}.layer small{display:block;font-size:7px;color:#6f675f;margin-top:3px}.layer button{border:0;background:transparent;color:#9e8c78;font-size:16px;cursor:pointer}.count{font-size:8px;color:#6f665d}.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.actions .btn{font-size:9px}
@media(max-width:1120px){.editor{grid-template-columns:250px minmax(330px,1fr)}.side{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.patterns{min-height:650px}}@media(max-width:780px){.editor{grid-template-columns:1fr}.side{grid-template-columns:1fr}.pattern-grid{grid-template-columns:repeat(3,1fr)}.stage{height:560px}.banner-wrap{gap:10px}.banner-view canvas{width:170px;height:275px}.shield{width:170px;height:225px}.shield-frame{border-width:8px}}
</style></head><body><header class="site-shell topbar"><div class="brand"><a class="brand-icon ui3d" href="../../"><svg viewBox="0 0 64 64"><path d="M18 9h7v46h-7zM25 14h29v36H25z" fill="#bdb7ae" stroke="#3a332d" stroke-width="3"/></svg></a><div><div class="eyebrow">MINECRAFT WORKSHOP</div><div class="tool-name">Banner Editor</div></div></div><div></div><div class="header-right"><nav class="nav"><a href="../../">Workshop</a><a href="../enchanting/">Enchanting</a><a href="../armoury/">Armoury</a><a class="active" href="./">Banner</a><a href="../nether/">Nether</a></nav></div></header><main class="site-shell editor"><aside class="panel depth-ui patterns"><div class="section-head"><div><div class="kicker">PATTERNS</div><h2>Banner patterns</h2></div><span class="count" id="count"></span></div><div class="pattern-grid" id="patternGrid"></div></aside><section class="panel depth-ui canvas-panel"><div class="section-head"><div><div class="kicker">PREVIEW</div><h2 id="name">White Banner</h2></div><span class="count" id="layerCount">0 / 6</span></div><div class="stage"><div class="preview-toggle"><button class="toggle active" data-view="banner">Banner</button><button class="toggle" data-view="shield">Shield</button></div><div class="banner-wrap"><div class="banner-view" id="bannerView"><div class="pole"></div><canvas id="banner" width="128" height="192"></canvas></div><div class="shield-wrap" id="shieldView" style="display:none"><div class="shield"><canvas id="shield" width="128" height="160"></canvas></div><div class="shield-frame"></div></div></div></div></section><aside class="side"><section class="panel depth-ui box"><div class="section-head"><div><div class="kicker">BASE</div><h2>Banner colour</h2></div><span class="count" id="baseName">White</span></div><div class="dye-grid" id="baseDyes"></div></section><section class="panel depth-ui box"><div class="section-head"><div><div class="kicker">DYE</div><h2>Pattern colour</h2></div><span class="count" id="dyeName">Black</span></div><div class="dye-grid" id="dyes"></div><div class="layers" id="layers"></div><div class="actions"><button class="btn primary ui3d" id="download">Export PNG</button><button class="btn ui3d" id="reset">Reset</button></div></section></aside></main><nav class="site-shell footer-nav"><a class="btn ui3d" href="../../">Workshop</a><a class="btn ui3d" href="../enchanting/">Enchanting</a><a class="btn ui3d" href="../armoury/">Armoury</a><a class="btn ui3d" href="../nether/">Nether ↔ Overworld</a></nav><script>
const C=[['white','#f1ece3'],['orange','#d87f33'],['magenta','#b64d9f'],['light_blue','#6aa7d9'],['yellow','#e5c53f'],['lime','#7dbf48'],['pink','#d98fa9'],['gray','#70757a'],['light_gray','#aaa9a2'],['cyan','#3d999c'],['purple','#8556a9'],['blue','#3f63a6'],['brown','#825b3e'],['green','#5d7f42'],['red','#b23d39'],['black','#1f2023']];
const P=[['square_bottom_left','Square Bottom Left'],['square_bottom_right','Square Bottom Right'],['square_top_left','Square Top Left'],['square_top_right','Square Top Right'],['stripe_bottom','Stripe Bottom'],['stripe_top','Stripe Top'],['stripe_left','Stripe Left'],['stripe_right','Stripe Right'],['stripe_center','Stripe Center'],['stripe_middle','Stripe Middle'],['stripe_downright','Stripe Down Right'],['stripe_downleft','Stripe Down Left'],['small_stripes','Small Stripes'],['cross','Cross'],['straight_cross','Straight Cross'],['triangle_bottom','Triangle Bottom'],['triangle_top','Triangle Top'],['triangles_bottom','Triangles Bottom'],['triangles_top','Triangles Top'],['diagonal_left','Diagonal Left'],['diagonal_up_right','Diagonal Up Right'],['diagonal_up_left','Diagonal Up Left'],['diagonal_right','Diagonal Right'],['circle','Circle'],['rhombus','Rhombus'],['half_vertical','Half Vertical'],['half_vertical_right','Half Vertical Right'],['half_horizontal','Half Horizontal'],['half_horizontal_bottom','Half Horizontal Bottom'],['border','Border'],['gradient','Gradient'],['gradient_up','Gradient Up'],['bricks','Bricks'],['curly_border','Curly Border'],['bordure_indented','Bordure Indented'],['creeper','Creeper Charge'],['flower','Flower Charge'],['globe','Globe'],['mojang','Thing'],['piglin','Snout'],['skull','Skull Charge'],['flow','Flow'],['guster','Guster']];
const SPECIAL={creeper:'creeper_banner_pattern',flower:'flower_banner_pattern',globe:'globe_banner_pattern',mojang:'mojang_banner_pattern',piglin:'piglin_banner_pattern',skull:'skull_banner_pattern',flow:'flow_banner_pattern',guster:'guster_banner_pattern',bricks:'field_masoned_banner_pattern',bordure_indented:'bordure_indented_banner_pattern'};
let base='white',dye='black',layers=[];const $=id=>document.getElementById(id),col=id=>C.find(x=>x[0]===id)[1];
function polygon(ctx,pts){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()}
function shape(ctx,p,c){const w=ctx.canvas.width,h=ctx.canvas.height;ctx.save();ctx.fillStyle=c;const q=v=>v/32*w,r=v=>v/52*h;switch(p){case'square_bottom_left':ctx.fillRect(0,h/2,w/2,h/2);break;case'square_bottom_right':ctx.fillRect(w/2,h/2,w/2,h/2);break;case'square_top_left':ctx.fillRect(0,0,w/2,h/2);break;case'square_top_right':ctx.fillRect(w/2,0,w/2,h/2);break;case'stripe_bottom':ctx.fillRect(0,h*.76,w,h*.24);break;case'stripe_top':ctx.fillRect(0,0,w,h*.24);break;case'stripe_left':ctx.fillRect(0,0,w*.24,h);break;case'stripe_right':ctx.fillRect(w*.76,0,w*.24,h);break;case'stripe_center':ctx.fillRect(w*.375,0,w*.25,h);break;case'stripe_middle':ctx.fillRect(0,h*.375,w,h*.25);break;case'stripe_downright':polygon(ctx,[[0,0],[w*.3,0],[w,h*.7],[w,h],[w*.7,h]]);break;case'stripe_downleft':polygon(ctx,[[w,0],[w*.7,0],[0,h*.7],[0,h],[w*.3,h]]);break;case'small_stripes':for(let x=-h;x<w+h;x+=12){ctx.save();ctx.translate(x,0);ctx.rotate(Math.PI/4);ctx.fillRect(0,-h,w*.14,h*2);ctx.restore()}break;case'cross':ctx.fillRect(w*.38,0,w*.24,h);ctx.fillRect(0,h*.38,w,h*.24);break;case'straight_cross':ctx.save();ctx.translate(w/2,h/2);ctx.rotate(Math.PI/4);ctx.fillRect(-w,h*.05,w*2,h*.19);ctx.rotate(Math.PI/2);ctx.fillRect(-w,-h*.24,w*2,h*.19);ctx.restore();break;case'diagonal_left':polygon(ctx,[[0,0],[w*.18,0],[w,h*.82],[w,h],[w*.82,h]]);break;case'diagonal_right':polygon(ctx,[[w,0],[w*.82,0],[0,h*.82],[0,h],[w*.18,h]]);break;case'diagonal_up_left':polygon(ctx,[[0,h],[w*.18,h],[w,0],[w*.82,0]]);break;case'diagonal_up_right':polygon(ctx,[[w,h],[w*.82,h],[0,0],[w*.18,0]]);break;case'triangle_bottom':polygon(ctx,[[0,h],[w,h],[w/2,h*.42]]);break;case'triangle_top':polygon(ctx,[[0,0],[w,0],[w/2,h*.58]]);break;case'triangles_bottom':for(let x=0;x<w;x+=w/4)polygon(ctx,[[x,h],[x+w/4,h],[x+w/8,h*.59]]);break;case'triangles_top':for(let x=0;x<w;x+=w/4)polygon(ctx,[[x,0],[x+w/4,0],[x+w/8,h*.41]]);break;case'half_horizontal':ctx.fillRect(0,0,w,h/2);break;case'half_horizontal_bottom':ctx.fillRect(0,h/2,w,h/2);break;case'half_vertical':ctx.fillRect(0,0,w/2,h);break;case'half_vertical_right':ctx.fillRect(w/2,0,w/2,h);break;case'border':ctx.lineWidth=Math.max(2,w/18);ctx.strokeStyle=c;ctx.strokeRect(ctx.lineWidth/2,ctx.lineWidth/2,w-ctx.lineWidth,h-ctx.lineWidth);break;case'curly_border':ctx.lineWidth=Math.max(2,w/18);ctx.strokeStyle=c;ctx.strokeRect(ctx.lineWidth/2,ctx.lineWidth/2,w-ctx.lineWidth,h-ctx.lineWidth);break;case'bordure_indented':ctx.lineWidth=Math.max(2,w/18);ctx.strokeStyle=c;ctx.strokeRect(ctx.lineWidth/2,ctx.lineWidth/2,w-ctx.lineWidth,h-ctx.lineWidth);for(let y=10;y<h;y+=18){ctx.fillRect(0,y,6,6);ctx.fillRect(w-6,y+6,6,6)}break;case'gradient':for(let y=0;y<h;y++){ctx.globalAlpha=y/h;ctx.fillRect(0,y,w,1)}ctx.globalAlpha=1;break;case'gradient_up':for(let y=0;y<h;y++){ctx.globalAlpha=1-y/h;ctx.fillRect(0,y,w,1)}ctx.globalAlpha=1;break;case'bricks':for(let y=0;y<h;y+=12)for(let x=0;x<w;x+=16){ctx.fillRect(x+(y/12%2)*8,y,12,8)}break;case'circle':ctx.beginPath();ctx.ellipse(w/2,h/2,w*.30,h*.30,0,0,Math.PI*2);ctx.fill();break;case'rhombus':polygon(ctx,[[w/2,h*.17],[w*.84,h/2],[w/2,h*.83],[w*.16,h/2]]);break;case'creeper':ctx.fillRect(w*.29,h*.23,w*.42,h*.45);ctx.clearRect(w*.36,h*.32,w*.09,h*.09);ctx.clearRect(w*.55,h*.32,w*.09,h*.09);ctx.fillRect(w*.43,h*.41,w*.14,h*.10);ctx.fillRect(w*.34,h*.58,w*.12,h*.21);ctx.fillRect(w*.54,h*.58,w*.12,h*.21);break;case'flower':for(let i=0;i<8;i++){ctx.beginPath();ctx.arc(w/2+Math.cos(i*Math.PI/4)*w*.18,h/2+Math.sin(i*Math.PI/4)*h*.18,w*.085,0,Math.PI*2);ctx.fill()}ctx.fillRect(w*.43,h*.43,w*.14,h*.14);break;case'globe':ctx.beginPath();ctx.arc(w/2,h/2,w*.28,0,Math.PI*2);ctx.fill();ctx.save();ctx.fillStyle=col(base);ctx.fillRect(w*.23,h*.43,w*.54,h*.10);ctx.fillRect(w*.45,h*.22,w*.10,h*.56);ctx.restore();break;case'mojang':polygon(ctx,[[w*.15,h*.20],[w*.85,h*.20],[w*.67,h*.42],[w*.52,h*.80],[w*.35,h*.55]]);break;case'piglin':ctx.fillRect(w*.22,h*.30,w*.56,h*.30);ctx.fillRect(w*.28,h*.22,w*.44,h*.11);ctx.fillRect(w*.33,h*.60,w*.34,h*.16);break;case'skull':ctx.fillRect(w*.24,h*.20,w*.52,h*.46);ctx.clearRect(w*.34,h*.32,w*.10,h*.10);ctx.clearRect(w*.56,h*.32,w*.10,h*.10);ctx.fillRect(w*.41,h*.51,w*.18,h*.12);ctx.fillRect(w*.34,h*.65,w*.12,h*.12);ctx.fillRect(w*.54,h*.65,w*.12,h*.12);break;case'flow':ctx.beginPath();ctx.moveTo(w*.13,h*.73);ctx.bezierCurveTo(w*.20,h*.12,w*.47,h*.35,w*.50,h*.59);ctx.bezierCurveTo(w*.54,h*.91,w*.79,h*.86,w*.86,h*.26);ctx.lineTo(w*.93,h*.36);ctx.bezierCurveTo(w*.82,h*.96,w*.57,h*.99,w*.43,h*.71);ctx.bezierCurveTo(w*.27,h*.40,w*.23,h*.74,w*.13,h*.83);ctx.closePath();ctx.fill();break;case'guster':ctx.fillRect(w*.34,h*.19,w*.32,h*.12);ctx.fillRect(w*.28,h*.31,w*.44,h*.33);ctx.fillRect(w*.20,h*.66,w*.60,h*.11);break;}ctx.restore()}
function iconFor(p){if(!SPECIAL[p])return null;return 'https://mcasset.cloud/26.3/assets/minecraft/textures/item/'+SPECIAL[p]+'.png'}
function thumb(p){const c=document.createElement('canvas');c.width=32;c.height=52;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.fillStyle='#ded7ce';x.fillRect(0,0,32,52);shape(x,p,'#c6b568');return c.toDataURL()}
function buildPatternUI(){ $('patternGrid').innerHTML=P.map((p,i)=>{const img=iconFor(p[0]);return `<button class="pbtn" data-p="${p[0]}">${img?`<img src="${img}" alt="">`:`<canvas data-c="${p[0]}" width="32" height="52"></canvas>`}<span><b>${p[1]}</b><small>${SPECIAL[p[0]]?'Pattern Item':'Loom'}</small></span></button>`}).join('');P.forEach(p=>{const c=document.querySelector(`canvas[data-c="${p[0]}"]`);if(c){const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.fillStyle='#ded7ce';x.fillRect(0,0,32,52);shape(x,p[0], '#c6b568')}});document.querySelectorAll('.pbtn').forEach(b=>b.onclick=()=>{if(layers.length>=6)return;layers.push({p:b.dataset.p,c:dye});render()})}
function render(){const bc=$('banner').getContext('2d'),sc=$('shield').getContext('2d');[bc,sc].forEach((ctx)=>{ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.fillStyle=col(base);ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);for(const l of layers)shape(ctx,l.p,col(l.c));});$('name').textContent=`${col(base)[0].toUpperCase()+col(base).slice(1)} Banner`;$('baseName').textContent=C.find(x=>x[0]===base)[0].replace('_',' ');$('dyeName').textContent=C.find(x=>x[0]===dye)[0].replace('_',' ');$('layerCount').textContent=`${layers.length} / 6`;$('layers').innerHTML=layers.length?layers.map((l,i)=>`<div class="layer"><img src="${thumb(l.p)}" alt=""><span><b>${P.find(p=>p[0]===l.p)?.[1]||l.p}</b><small>${l.c.replace('_',' ')}</small></span><button data-del="${i}">×</button></div>`).join(''):'<span class="small muted">No layers</span>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{layers.splice(+b.dataset.del,1);render()})}
$('baseDyes').innerHTML=C.map(x=>`<button class="dye ${x[0]===base?'active':''}" data-base="${x[0]}"><i style="background:${x[1]}"></i><span>${x[0].replace('_',' ')}</span></button>`).join('');$('dyes').innerHTML=C.map(x=>`<button class="dye ${x[0]===dye?'active':''}" data-dye="${x[0]}"><i style="background:${x[1]}"></i><span>${x[0].replace('_',' ')}</span></button>`).join('');document.querySelectorAll('[data-base]').forEach(b=>b.onclick=()=>{base=b.dataset.base;document.querySelectorAll('[data-base]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-dye]').forEach(b=>b.onclick=()=>{dye=b.dataset.dye;document.querySelectorAll('[data-dye]').forEach(x=>x.classList.toggle('active',x===b))});document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{document.querySelectorAll('.toggle').forEach(x=>x.classList.toggle('active',x===b));$('bannerView').style.display=b.dataset.view==='banner'?'grid':'none';$('shieldView').style.display=b.dataset.view==='shield'?'grid':'none'});$('reset').onclick=()=>{base='white';dye='black';layers=[];document.querySelectorAll('[data-base],[data-dye]').forEach(b=>b.classList.remove('active'));document.querySelector('[data-base="white"]').classList.add('active');document.querySelector('[data-dye="black"]').classList.add('active');render()};$('download').onclick=()=>{const a=document.createElement('a');a.href=$('banner').toDataURL('image/png');a.download='minecraft-banner.png';a.click()};buildPatternUI();render();
</script><script src="../../shared/global-3d.js"></script></body></html>
