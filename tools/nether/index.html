</style></head><body><header class="site-shell topbar"><div class="brand"><a class="brand-icon ui3d" href="../../"><div class="portal" style="width:23px;height:30px;border:4px solid #282321;background:#713ea0;box-shadow:0 0 10px #70419a"></div></a><div><div class="eyebrow">MINECRAFT WORKSHOP</div><div class="tool-name">Nether ↔ Overworld</div></div></div><div></div><div class="header-right"><nav class="nav"><a href="../../">Workshop</a><a href="../enchanting/">Enchanting</a><a href="../armoury/">Armoury</a><a href="../banner/">Banner</a><a class="active" href="./">Nether</a></nav></div></header><main class="site-shell calc"><section class="panel depth-ui direction"><div class="side"><div class="kicker">FROM</div><h2>Overworld</h2><div class="coord-grid"><label class="field"><span>X</span><input class="input" id="x" type="number" value="0"></label><label class="field"><span>Y</span><input class="input" id="y" type="number" value="64"></label><label class="field"><span>Z</span><input class="input" id="z" type="number" value="0"></label></div></div><div class="swap">↔</div><div class="side"><div class="kicker">TO</div><h2 id="to">Nether</h2><div class="coord-grid"><div class="coord"><span>X</span><strong id="ox">0</strong></div><div class="coord"><span>Y</span><strong id="oy">64</strong></div><div class="coord"><span>Z</span><strong id="oz">0</strong></div></div></div></section><section class="panel depth-ui result"><div class="section-head"><div><div class="kicker">PORTAL COORDINATES</div><h2 id="summary">0, 64, 0</h2></div><button class="btn ui3d" id="flip">Flip</button></div><div class="portal-art"><div class="frame"></div></div></section></main><nav class="site-shell footer-nav"><a class="btn ui3d" href="../../">Workshop</a><a class="btn ui3d" href="../enchanting/">Enchanting</a><a class="btn ui3d" href="../armoury/">Armoury</a><a class="btn ui3d" href="../banner/">Banner</a></nav><script>
let dir='overworld-to-nether';const $=id=>document.getElementById(id);function calc(){const x=Number($('x').value||0),y=Number($('y').value||0),z=Number($('z').value||0),m=dir==='overworld-to-nether'?1/8:8,ox=m===1/8?Math.round(x*m*100)/100:Math.round(x*m*100)/100,oz=m===1/8?Math.round(z*m*100)/100:Math.round(z*m*100)/100;$('ox').textContent=ox;$('oy').textContent=y;$('oz').textContent=oz;$('to').textContent=dir==='overworld-to-nether'?'Nether':'Overworld';$('summary').textContent=`${ox}, ${y}, ${oz}`};['x','y','z'].forEach(id=>$(id).addEventListener('input',calc));$('flip').onclick=()=>{dir=dir==='overworld-to-nether'?'nether-to-overworld':'overworld-to-nether';calc()};calc();</script><script src="../../shared/global-3d.js"></script></body></html>
